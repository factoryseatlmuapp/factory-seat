# Builds the Windows installer and the Linux tarball on GitHub's machines, from the public source.
# - push to the `ci` branch or "Run workflow" in the Actions tab: build + tests only, files kept as run artifacts
# - push a version tag (v1.4.0): the same, then a DRAFT release with both files attached. Publishing stays manual
#   (opsec scan, VirusTotal, notes first).
# Code signing (SignPath Foundation): the exe is signed before Inno Setup packs it, then the installer itself.
# Needs the SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID variable. The SIGNPATH_POLICY variable picks
# the policy: test-signing (self-signed test cert, the default) until the production cert is in, then release-signing.
name: Release build

on:
  push:
    branches: [ci]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Tools (Inno Setup, Pillow)
        run: |
          choco install innosetup -y --no-progress
          python -m pip install --quiet pillow

      - name: Tests
        run: dotnet test tests/LmuCareer.Core.Tests -c Release

      - name: Publish app
        run: powershell -File installer\build.ps1 -Step publish

      - name: Upload unsigned app
        id: unsigned-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: publish/FactorySeat.exe
          if-no-files-found: error

      - name: Sign app
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: factory-seat
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY || 'test-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish/signed-app

      - name: Swap in the signed app
        shell: pwsh
        run: Copy-Item publish\signed-app\FactorySeat.exe publish\FactorySeat.exe -Force

      - name: Windows installer
        run: powershell -File installer\build.ps1 -Step installer

      - name: Upload unsigned installer
        id: unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: publish/installer/*.exe
          if-no-files-found: error

      - name: Sign installer
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: factory-seat
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY || 'test-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish/signed-installer

      - name: Swap in the signed installer and check both signatures
        shell: pwsh
        run: |
          Copy-Item publish\signed-installer\*.exe publish\installer\ -Force
          # A test-cert signature reads as untrusted; what this checks is that a signature is there at all.
          Get-ChildItem publish\FactorySeat.exe, publish\installer\*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_
            if (-not $sig.SignerCertificate) { throw "$($_.Name) is not signed." }
            "$($_.Name): $($sig.Status), $($sig.SignerCertificate.Subject)"
          }

      - name: Linux tarball
        run: python installer/build-linux.py

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem publish\installer\*.exe, publish\linux\*.tar.gz |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Tee-Object publish\SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: factory-seat-${{ github.ref_name }}
          path: |
            publish/installer/*.exe
            publish/linux/*.tar.gz
            publish/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: factory-seat-${{ github.ref_name }}
          path: dist

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft \
            --title "Factory Seat ${GITHUB_REF_NAME#v}" --notes "Draft built by GitHub Actions. Notes to follow." \
            $(find dist -type f)
