<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Factory Seat OBS overlay</title>
<!--
  Factory Seat stream overlay. One file, no network.
  Put it next to briefing.json (%AppData%\LmuCareer) and add it to OBS as a Browser source,
  "Local file" ticked, width 460, height 780. It reads briefing.json every few seconds.

  Hide a panel with OBS's Custom CSS box, e.g.:
    #sponsors { display: none; }
    #history { display: none; }
  Bigger without blur: make the source N times larger (e.g. 920 x 1560) and add  body { zoom: 2; }
-->
<style>
/*FONTS*/
:root {
  --panel: #0b0f1a;
  --panel-2: #131a29;
  --line: rgba(255, 255, 255, 0.12);
  --text: #f2f4f8;
  --dim: #a0a8b9;
  --faint: #697387;
  --accent: #e3192f;
  --good: #3fb950;
  --warn: #e3a21a;
  --bad: #f2545b;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; color: var(--text); overflow: hidden; }
body { font: 500 17px/1.25 var(--cond); width: 460px; padding: 10px; }
.card { position: relative; background: var(--panel); border-left: 4px solid var(--accent);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45); overflow: hidden; }
.card + .card { margin-top: 8px; }
.up { text-transform: uppercase; letter-spacing: 0.03em; }

/* Header: brand stripe, event, track map */
#head { padding: 12px 14px 12px 16px; min-height: 112px; }
#head::before { content: ""; position: absolute; top: 0; right: 0; width: 120px; height: 120px; opacity: 0.9;
  background: linear-gradient(225deg, var(--accent) 0 14%, transparent 14% 18%, rgba(227, 25, 47, 0.5) 18% 24%, transparent 24%); }
.brand { font: 700 15px var(--cond); letter-spacing: 0.06em; color: var(--dim); }
.brand em { font-style: normal; color: var(--accent); margin-left: 1px; }
.brand .live { margin-left: 8px; padding: 1px 6px; font-size: 12px; color: #fff; background: var(--accent); border-radius: 2px; }
.brand .live::before { content: "●"; margin-right: 4px; animation: pulse 1.6s ease-in-out infinite; }
.brand .guest { margin-left: 8px; padding: 1px 6px; font-size: 12px; color: #0b0f1a; background: var(--warn); border-radius: 2px; }
@keyframes pulse { 50% { opacity: 0.25; } }
#event { font: 700 30px/1 var(--cond); margin-top: 4px; max-width: 320px; }
#event.long { font-size: 24px; }
#round { font: 600 16px var(--cond); color: var(--dim); margin-top: 3px; }
#track { font-size: 15px; color: var(--faint); margin-top: 1px; max-width: 300px; }
#map { position: absolute; right: 14px; bottom: 10px; width: 108px; height: 78px; }
#map svg { width: 100%; height: 100%; fill: none; stroke: var(--text); stroke-width: 14; stroke-linejoin: round;
  stroke-linecap: round; filter: drop-shadow(0 0 6px rgba(227, 25, 47, 0.5)); }

/* Car strip */
#car { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 0; background: var(--panel-2); border-left-color: var(--text); }
#car .num { font: 700 26px/1 var(--cond); min-width: 56px; text-align: center; padding: 4px 8px; background: var(--text); color: #0b0f1a; }
#car .who { min-width: 0; }
#car .name { font: 700 19px/1.05 var(--cond); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#car .team { font-size: 15px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#car .cls { margin-left: auto; font: 700 14px var(--cond); padding: 2px 7px; border: 1px solid var(--dim); color: var(--dim); }

/* Championship */
#champ { padding: 12px 14px 12px 16px; }
.title { font: 700 13px var(--cond); color: var(--faint); letter-spacing: 0.08em; margin-bottom: 6px; }
.pos { display: flex; align-items: baseline; gap: 12px; }
.pos .p { font: 700 52px/0.9 var(--cond); }
.pos .pts { font: 600 22px var(--cond); color: var(--dim); }
.pos .pts b { color: var(--text); font-weight: 700; }
.rivals { margin-top: 8px; display: grid; gap: 4px; }
.rival { display: grid; grid-template-columns: 22px 34px 1fr auto; align-items: baseline; gap: 6px; font-size: 17px; }
.rival .arrow { color: var(--faint); font-size: 14px; }
.rival .rp { font-weight: 700; color: var(--dim); }
.rival .rn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rival .gap { font-weight: 700; }
.rival.ahead .gap { color: var(--warn); }
.rival.behind .gap { color: var(--good); }
.stake { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font: 500 16px/1.25 var(--cond); color: var(--dim); }
.stake + .stake { margin-top: 4px; padding-top: 0; border-top: 0; }

/* Race plan */
#plan { display: grid; grid-template-columns: repeat(3, 1fr); padding: 10px 14px 10px 16px; gap: 4px; }
#plan div { min-width: 0; }
#plan b { display: block; font: 700 22px/1 var(--cond); }
#plan span { font: 600 12px var(--cond); color: var(--faint); letter-spacing: 0.06em; text-transform: uppercase; }

/* Sponsors */
#sponsors { padding: 10px 14px 12px 16px; }
.sp { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: baseline; }
.sp + .sp { margin-top: 6px; }
.sp .sn { font: 700 17px var(--cond); text-transform: uppercase; letter-spacing: 0.02em; }
.sp .ss { font: 700 13px var(--cond); letter-spacing: 0.05em; text-transform: uppercase; }
.sp .ss.InProgress { color: var(--dim); }
.sp .ss.Met { color: var(--good); }
.sp .ss.Failed { color: var(--bad); }
.sp .so { grid-column: 1 / -1; font-size: 15px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp .bar { grid-column: 1 / -1; height: 4px; background: var(--line); }
.sp .bar i { display: block; height: 100%; background: var(--accent); transition: width 0.6s ease; }
.sp.Met .bar i { background: var(--good); }
.sp.Failed .bar i { background: var(--bad); }

/* History at this track */
#history { padding: 10px 14px 10px 16px; }
.hrow { display: flex; justify-content: space-between; font-size: 16px; color: var(--dim); }
.hrow b { color: var(--text); }

#wait { padding: 14px 16px; color: var(--dim); }
.hidden { display: none !important; }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: rgba(227, 25, 47, 0.35); } }
</style>
</head>
<body>
<div id="wait" class="card">
  <div class="brand up">FACTORY<em>SEAT</em></div>
  <div id="waitMsg">Waiting for briefing.json…</div>
</div>

<div id="main" class="hidden">
  <div id="head" class="card">
    <div class="brand up">FACTORY<em>SEAT</em><span id="badge"></span></div>
    <div id="event" class="up"></div>
    <div id="round" class="up"></div>
    <div id="track"></div>
    <div id="map"></div>
  </div>

  <div id="car" class="card">
    <div class="num" id="carNum"></div>
    <div class="who"><div class="name" id="carName"></div><div class="team" id="carTeam"></div></div>
    <div class="cls" id="carClass"></div>
  </div>

  <div id="champ" class="card">
    <div class="title up">Championship</div>
    <div class="pos"><span class="p" id="champPos"></span><span class="pts" id="champPts"></span></div>
    <div class="rivals" id="rivals"></div>
    <div id="stakes"></div>
  </div>

  <div id="plan" class="card"></div>

  <div id="sponsors" class="card">
    <div class="title up">Sponsors</div>
    <div id="spList"></div>
  </div>

  <div id="history" class="card">
    <div class="title up">Last time here</div>
    <div id="hList"></div>
  </div>
</div>

<script>
const MAPS = /*MAPS*/null;
const POLL_MS = 3000;
const MAX_SPONSORS = 3;
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const fmtPts = (n) => (Math.round(n * 10) / 10).toString();
const fmtLap = (s) => {
  if (s == null) return "–";
  const m = Math.floor(s / 60), r = s - m * 60;
  return `${m}:${r.toFixed(3).padStart(6, "0")}`;
};
const cleanEvent = (s) => s.replace(/\s+/g, " ").trim();
const ord = (n) => {
  const t = n % 100;
  if (t >= 11 && t <= 13) return n + "th";
  return n + ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th");
};

function mapSvg(map) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", map.viewBox);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  const p = document.createElementNS(ns, "path");
  p.setAttribute("d", map.d);
  p.setAttribute("vector-effect", "non-scaling-stroke");
  p.style.strokeWidth = "3px";
  svg.appendChild(p);
  return svg;
}

// Fill a box only when its content changes, and flash it so viewers notice.
const last = {};
function put(id, build, key) {
  const k = JSON.stringify(key);
  if (last[id] === k) return;
  const first = last[id] === undefined;
  last[id] = k;
  const box = $(id);
  box.replaceChildren(...[].concat(build()).filter(Boolean));
  if (!first) {
    const card = box.closest(".card");
    card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash");
  }
}

function render(b) {
  $("wait").classList.add("hidden");
  $("main").classList.remove("hidden");
  const r = b.round;
  const c = b.career;

  // Between seasons: just the career.
  if (!r) {
    put("event", () => document.createTextNode(c.name), c.name);
    put("round", () => document.createTextNode(`Season ${c.season} done`), c.season);
    ["car", "champ", "plan", "history"].forEach((id) => $(id).classList.add("hidden"));
    put("badge", () => null, "none");
    $("track").textContent = ""; $("map").replaceChildren();
    renderSponsors(b.sponsors || []);
    return;
  }

  const armed = r.state === "Armed";
  put("badge", () => r.guest ? el("span", "guest", "Guest drive") : armed ? el("span", "live", "Race weekend") : null,
    [r.guest, armed]);
  put("event", () => document.createTextNode(cleanEvent(r.event.name)), r.event.name);
  $("event").classList.toggle("long", r.event.name.length > 20);
  put("round", () => {
    const parts = [r.guest ? "One-off" : `Round ${r.number} of ${r.of}`, `Season ${c.season}`];
    if (r.event.pointsWeight > 1) parts.push(r.event.pointsWeight === 2 ? "Double points" : `×${r.event.pointsWeight} points`);
    return document.createTextNode(parts.join("  ·  "));
  }, [r.number, r.of, c.season, r.guest, r.event.pointsWeight]);
  put("track", () => document.createTextNode(
    r.track.layoutName && r.track.layoutName !== r.track.name ? `${r.track.name} · ${r.track.layoutName}` : r.track.name),
    [r.track.name, r.track.layoutName]);
  const map = MAPS && MAPS[`${r.track.folder}/${r.track.layoutFile}`];
  put("map", () => map ? mapSvg(map) : null, [r.track.folder, r.track.layoutFile]);

  // Car
  $("car").classList.remove("hidden");
  put("car", () => {
    const num = el("div", "num", r.car.number ? `#${r.car.number}` : "#");
    const who = el("div", "who");
    who.append(el("div", "name", r.car.name), el("div", "team", r.car.team || c.team || ""));
    return [num, who, el("div", "cls", r.car.class)];
  }, [r.car.number, r.car.name, r.car.team, c.team, r.car.class]);

  // Championship
  const s = r.stakes;
  $("champ").classList.toggle("hidden", !s);
  if (s) {
    put("champPos", () => document.createTextNode(s.position ? `P${s.position}` : "–"), s.position);
    put("champPts", () => {
      const f = document.createDocumentFragment();
      const bEl = el("b", null, fmtPts(s.points)); f.append(bEl, document.createTextNode(" pts"));
      return [...f.childNodes];
    }, s.points);
    put("rivals", () => {
      const rows = [];
      const row = (kind, d, arrow) => {
        const x = el("div", `rival ${kind}`);
        x.append(el("span", "arrow", arrow), el("span", "rp", `P${d.position}`), el("span", "rn", d.name),
          el("span", "gap", `${kind === "ahead" ? "−" : "+"}${fmtPts(d.gap)}`));
        return x;
      };
      if (s.ahead) rows.push(row("ahead", s.ahead, "▲"));
      if (s.behind) rows.push(row("behind", s.behind, "▼"));
      return rows;
    }, [s.ahead, s.behind]);
    // lines[0] is the position we already show big; the next two are the story of the race.
    put("stakes", () => (s.lines || []).slice(1, 3).map((t) => el("div", "stake", t)), s.lines);
  }

  // Race plan
  $("plan").classList.remove("hidden");
  put("plan", () => {
    const cell = (v, k) => { const d = el("div"); d.append(el("b", null, v), el("span", null, k)); return d; };
    const st = r.settings;
    const out = [cell(`${st.raceMinutes} min`, "Race")];
    if (r.pitPlan) out.push(cell(r.pitPlan.stops === 0 ? "No stop" : `${r.pitPlan.stops} stop${r.pitPlan.stops > 1 ? "s" : ""}`,
      `${r.pitPlan.stints} × ~${r.pitPlan.stintMinutes} min`));
    else out.push(cell("–", "Pit plan"));
    const pr = r.practice;
    if (pr && pr.bestLap) out.push(cell(fmtLap(pr.bestLap), pr.gap != null ? `Practice ${pr.gap <= 0 ? "−" : "+"}${Math.abs(pr.gap).toFixed(1)}s vs AI` : "Practice best"));
    else out.push(cell(st.startTime || "Default", "Start time"));
    return out;
  }, [r.settings, r.pitPlan, r.practice]);

  // History at this layout
  const hist = r.history || [];
  $("history").classList.toggle("hidden", hist.length === 0);
  put("hList", () => hist.slice(0, 2).map((h) => {
    const row = el("div", "hrow");
    const left = el("span", null, `S${h.season} R${h.round}`);
    const right = el("span");
    right.append(el("b", null, h.finish ? `P${h.finish}` : (h.status || "DNF")), document.createTextNode(h.bestLap ? `  ·  ${fmtLap(h.bestLap)}` : ""));
    row.append(left, right);
    return row;
  }), hist);

  renderSponsors(b.sponsors || []);
}

function renderSponsors(list) {
  $("sponsors").classList.toggle("hidden", list.length === 0);
  const rank = { InProgress: 0, Met: 1, Failed: 2 };
  const shown = [...list].sort((a, b) => (rank[a.status] ?? 3) - (rank[b.status] ?? 3)).slice(0, MAX_SPONSORS);
  put("spList", () => shown.map((sp) => {
    const row = el("div", `sp ${sp.status}`);
    const label = sp.status === "Met" ? "Done" : sp.status === "Failed" ? "Missed" : progressLabel(sp);
    row.append(el("span", "sn", sp.name), el("span", `ss ${sp.status}`, label), el("span", "so", sp.objective));
    if (COUNTED.has(sp.kind) && sp.needed) {
      const bar = el("div", "bar"), fill = el("i");
      fill.style.width = `${Math.min(100, (sp.status === "Met" ? 1 : sp.done / sp.needed) * 100)}%`;
      bar.append(fill); row.append(bar);
    }
    return row;
  }), list);
}

// Kinds where done/needed is a count towards a goal, drawn as a bar.
const COUNTED = new Set(["FinishEveryRound", "Podiums", "Wins", "Poles"]);

// The rest: championship kinds carry positions (BeatRival = mine vs the rival's), CleanSeason
// carries penalties, PodiumAt is one race.
function progressLabel(sp) {
  switch (sp.kind) {
    case "ChampionshipTop": return sp.done ? `P${sp.done} · top ${sp.needed}` : `Top ${sp.needed}`;
    case "BeatRival": return sp.done && sp.needed ? `P${sp.done} vs P${sp.needed}` : "Live";
    case "CleanSeason": return sp.done === 0 ? "Clean" : `${sp.done} penalty`;
    case "PodiumAt": return "Live";
    default: return `${sp.done} / ${sp.needed}`;
  }
}

let lastText = null;
async function poll() {
  try {
    const res = await fetch("briefing.json?t=" + Date.now(), { cache: "no-store" });
    const text = await res.text();
    if (text !== lastText) {
      const b = JSON.parse(text);
      if (b.format !== "factory-seat-briefing") throw new Error("not a Factory Seat briefing");
      lastText = text;
      render(b);
    }
  } catch (e) {
    if (lastText === null) $("waitMsg").textContent = "Waiting for briefing.json… put this file in %AppData%\\LmuCareer";
  }
}
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
